name: Quality Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Test & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --prefer-online || npm install --no-audit --prefer-online --package-lock=false
      - name: Validate timetable data
        run: npm run validate:timetable
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build

  audit:
    name: Lighthouse & Pa11y
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --prefer-online || npm install --no-audit --prefer-online --package-lock=false
      - name: Build
        run: npm run build
      - name: Lighthouse CI
        run: npx @lhci/cli@0.14.0 autorun --config=./lighthouserc.json
      - name: Start static server
        run: |
          npx http-server@14 dist -p 4173 --silent &
          npx wait-on@7 http://127.0.0.1:4173/ --timeout 60000
      - name: Pa11y CI
        run: npx pa11y-ci@3.1.0 --config .pa11yci.json
      - name: Browser regression tests
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Stop static server
        if: always()
        run: pkill -f http-server || true
